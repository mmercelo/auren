<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AUREN STUDIO — Shop all products." />
  <title>Shop — AUREN STUDIO</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f2;
      --fg: #1a1a1a;
      --muted: #888;
      --border: #e0ddd9;
      --accent: #1a1a1a;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 0.01em;
      line-height: 1.6;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 40px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    nav a.logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--fg);
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 32px;
    }

    nav ul a {
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--muted);
      transition: color 0.2s;
    }

    nav ul a:hover,
    nav ul a.active { color: var(--fg); }

    /* PAGE HEADER */
    .page-header {
      padding: 56px 40px 32px;
      border-bottom: 1px solid var(--border);
    }

    .page-header p {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .page-header h1 {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    /* GRID */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border-top: 1px solid var(--border);
    }

    .product-card {
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .product-card .img-wrap {
      aspect-ratio: 3/4;
      overflow: hidden;
      background: #ece9e4;
    }

    .product-card .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .product-card:hover .img-wrap img { transform: scale(1.03); }

    .product-card .info {
      padding: 20px 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .product-card .name {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .product-card .price {
      font-size: 13px;
      color: var(--muted);
    }

    .product-card .btn {
      margin-top: 16px;
      display: inline-block;
      padding: 10px 20px;
      background: var(--fg);
      color: var(--bg);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      transition: opacity 0.2s;
      align-self: flex-start;
    }

    .product-card .btn:hover { opacity: 0.75; }

    /* FOOTER */
    footer {
      border-top: 1px solid var(--border);
      padding: 32px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    footer ul {
      list-style: none;
      display: flex;
      gap: 24px;
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.2s;
    }

    footer a:hover { color: var(--fg); }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      nav { padding: 20px 20px; }
      .page-header { padding: 40px 20px 24px; }
      .shop-grid { grid-template-columns: repeat(2, 1fr); }
      footer { flex-direction: column; gap: 16px; padding: 28px 20px; }
    }

    @media (max-width: 480px) {
      .shop-grid { grid-template-columns: 1fr; }
      nav ul { gap: 20px; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="logo" href="index.html">Auren Studio</a>
    <ul>
      <li><a href="shop.html" class="active">Shop</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="page-header">
    <p>New Collection — 2026</p>
    <h1>All Products</h1>
  </div>

  <div class="shop-grid">

    <div class="product-card">
      <div class="img-wrap">
        <img src="images/product1.jpg" alt="Auren Studio Crewneck — Beige" />
      </div>
      <div class="info">
        <span class="name">Crewneck — Beige</span>
        <span class="price">£65</span>
        <a class="btn" href="https://buy.stripe.com/REPLACE_LINK_1">Buy now</a>
      </div>
    </div>

    <div class="product-card">
      <div class="img-wrap">
        <img src="images/product2.jpg" alt="Auren Studio Crewneck — Grey" />
      </div>
      <div class="info">
        <span class="name">Crewneck — Grey</span>
        <span class="price">£65</span>
        <a class="btn" href="https://buy.stripe.com/REPLACE_LINK_2">Buy now</a>
      </div>
    </div>

    <div class="product-card">
      <div class="img-wrap">
        <img src="images/product3.jpg" alt="Auren Studio Crewneck — Brown" />
      </div>
      <div class="info">
        <span class="name">Crewneck — Brown</span>
        <span class="price">£65</span>
        <a class="btn" href="https://buy.stripe.com/REPLACE_LINK_3">Buy now</a>
      </div>
    </div>

  </div>

  <footer>
    <span>© 2026 AUREN STUDIO</span>
    <ul>
      <li><a href="mailto:namedfame99@gmail.com">Support</a></li>
      <li><a href="#">Instagram</a></li>
      <li><a href="#">TikTok</a></li>
    </ul>
  </footer>

</body>
</html>
